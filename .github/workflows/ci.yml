name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: python -m pytest
      - name: Security
        run: bandit -q -r app
