<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workbench</title><link rel="stylesheet" href="/static/workbench.css"></head>
<body>
<main>
  <h1>Foundation ready</h1>
  <p>Signed in as {{ user.username }} ({{ user.role }}).</p>
  <nav aria-label="Workbench">
    <a href="/sources">Sources</a>
    <a href="/events">Events</a>
    <a href="/alerts">Alerts</a>
    <a href="/cases">Cases</a>
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Sign out</button>
  </form>
</main>
</body>
</html>
